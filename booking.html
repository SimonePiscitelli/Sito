<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Physics Lesson - Simone Piscitelli</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-deep-space: #050508;
            --bg-card: #121218;
            --border-color: #2a2a35;
            --text-main: #e0e0e6;
            --text-muted: #8a8a9e;
            --accent-glow: #ffffff;
            
            --font-academic: 'Cinzel', serif;
            --font-body: 'Inter', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-deep-space);
            color: var(--text-main);
            font-family: var(--font-body);
            line-height: 1.7;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* FIXED NAVBAR */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 60px;
            background: rgba(5, 5, 8, 0.88);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            z-index: 1000;
        }

        .profile-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .profile-pic {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .logo {
            font-family: var(--font-academic);
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #fff;
            text-transform: uppercase;
        }

        .back-link {
            color: var(--text-muted);
            text-decoration: none;
            font-family: var(--font-academic);
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .back-link:hover {
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        /* MAIN CONTAINER */
        main {
            padding: 140px 15% 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-grow: 1;
            position: relative;
        }

        /* SUBTLE BACKGROUND GRID PATTERN */
        main::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(var(--border-color) 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: 0.15;
            pointer-events: none;
        }

        .booking-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 40px 50px;
            width: 100%;
            max-width: 650px;
            border-radius: 2px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            z-index: 1;
        }

        .booking-card h1 {
            font-family: var(--font-academic);
            font-size: 1.8rem;
            color: #fff;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 10px;
            border-left: 2px solid #fff;
            padding-left: 15px;
        }

        .booking-card p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 30px;
        }

        /* FORM STYLING */
        .form-group {
            margin-bottom: 22px;
            display: flex;
            flex-direction: column;
        }

        label {
            font-family: var(--font-academic);
            font-size: 0.8rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #fff;
            margin-bottom: 8px;
        }

        input, select, textarea {
            background: #08080c;
            border: 1px solid var(--border-color);
            padding: 12px 15px;
            color: var(--text-main);
            font-family: var(--font-body);
            font-size: 0.95rem;
            border-radius: 2px;
            outline: none;
            transition: border-color 0.3s ease;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #777;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 10px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.8);
            color: #fff;
            font-family: var(--font-academic);
            font-size: 0.85rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.4s ease;
        }

        button:hover {
            background: #fff;
            color: #000;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        /* FOOTER */
        footer {
            text-align: center;
            padding: 25px;
            background: var(--bg-deep-space);
            border-top: 1px solid var(--border-color);
            font-family: var(--font-academic);
            font-size: 0.75rem;
            letter-spacing: 2px;
            color: var(--text-muted);
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                padding: 20px;
                gap: 10px;
            }
            main {
                padding: 160px 5% 40px;
            }
            .booking-card {
                padding: 25px;
            }
            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- TOP NAVIGATION BAR -->
    <header>
        <div class="profile-container">
            <img src="imgs/fotocv.jpeg" alt="Simone Piscitelli" class="profile-pic">
            <div class="logo">Simone Piscitelli</div>
        </div>
        <a href="index.html" class="back-link">&larr; Back to Home</a>
    </header>

    <!-- BOOKING FORM SECTION -->
    <main>
        <div class="booking-card">
            <h1>Book a Tutoring Session</h1>
            <p>Select your preferred topic and time slot for a General Physics I & II tutoring or consultation session.</p>

            <!-- SOSTITUISCI L'URL IN ACTION CON IL TUO ENDPOINT DI FORMSPREE -->
            <form action="https://formspree.io/f/mdeopdzk" method="POST">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" placeholder="John Doe" required>
                </div>

                <div class="form-group">
                    <label for="email">Academic Email</label>
                    <input type="email" id="email" name="_replyto" placeholder="student@university.edu" required>
                </div>

                <div class="form-group">
                    <label for="subject">Course Topic</label>
                    <select id="subject" name="subject" required>
                        <option value="" disabled selected>Select a topic...</option>
                        <option value="kinematics">General Physics I: Classical Mechanics & Dynamics</option>
                        <option value="thermodynamics">General Physics I: Thermodynamics</option>
                        <option value="electromagnetism">General Physics II: Electromagnetism</option>
                        <option value="optics">General Physics II: Optics & Waves</option>
                        <option value="exam-prep">Exam Preparation & Exercises</option>
                    </select>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="date">Preferred Date</label>
                        <input type="date" id="date" name="date" required>
                    </div>

                    <div class="form-group">
                        <label for="time">Preferred Time Slot</label>
                        <select id="time" name="time" required>
                            <option value="" disabled selected>Select time...</option>
                            <option value="16:00">04:00 - 05:00 PM</option>
                            <option value="14:00">05:00 - 06:00 PM</option>
                            <option value="14:00">06:00 - 07:00 PM</option>

                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="notes">Additional Notes / Questions</label>
                    <textarea id="notes" name="notes" rows="4" placeholder="Mention specific exercises or theoretical topics you would like to cover..."></textarea>
                </div>

                <!-- CAMPO NASCOSTO PER L'OGGETTO DELL'E-MAIL -->
                <input type="hidden" name="_subject" value="New Physics Tutoring Booking Request">

                <button type="submit">Confirm Reservation</button>
            </form>
        </div>
    </main>

    <!-- FOOTER -->
    <footer>
        <p>&copy; 2026 Simone Piscitelli. ALL RIGHTS RESERVED.</p>
    </footer>

</body>
</html>
